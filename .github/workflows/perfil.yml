# Gera as imagens do README (métricas + cobrinha) e publica tudo junto na branch `output`.
# Um workflow só porque o publish substitui a branch inteira: dois workflows apagariam o arquivo um do outro.
name: Perfil

on:
  schedule:
    - cron: "0 6 * * *" # todo dia, 03:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # METRICS_TOKEN: token clássico com escopos `repo` e `read:user`.
      # É ele que deixa as métricas enxergarem os repositórios privados.
      - name: Métricas
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: TheDittrich
          filename: metrics.svg
          output_action: none
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Sao_Paulo
          config_display: large
          repositories_affiliations: owner, collaborator, organization_member
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, shell, powershell
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes
          plugin_habits_days: 30

      # A cobrinha lê o gráfico público de contribuições, que já inclui as privadas
      # quando "Include private contributions" está ligado no perfil.
      - name: Cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: TheDittrich
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Junta as imagens
        run: sudo cp /metrics_renders/metrics.svg dist/metrics.svg

      - name: Publica na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
